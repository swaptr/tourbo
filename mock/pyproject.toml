[project]
name = "tourbo-mock"
version = "0.1.0"
description = "Local fan-data mock for Tourbo (dev only)"
readme = "README.md"
authors = [
    { name = "Swapnil Tripathi", email = "swapnil06.st@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
tourbo-mock = "tourbo_mock:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
