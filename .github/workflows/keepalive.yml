# Keeps the Render free instance awake during judging (Nov 2–5): it sleeps after 15 min idle.
# Set the repository variable TOURBO_URL (e.g. https://tourbo.onrender.com) to enable.
name: keepalive

on:
  schedule:
    - cron: "*/10 * 1-6 11 *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.TOURBO_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.TOURBO_URL }}/healthz"
