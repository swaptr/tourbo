# Keeps the Render free instance awake during judging (Nov 2–5): it sleeps after 15 min idle.
# Set TOURBO_URL (repository variable or secret, e.g. https://tourbo.onrender.com) to enable.
name: keepalive

on:
  schedule:
    - cron: "*/10 * 1-6 11 *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      URL: ${{ vars.TOURBO_URL || secrets.TOURBO_URL }}
    steps:
      - run: '[ -z "$URL" ] || curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$URL/healthz"'
