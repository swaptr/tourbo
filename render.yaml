services:
  - type: web
    name: tourbo
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: OUTREACH_REPLY_DOMAIN
        sync: false
      - key: MCP_TOKENS
        sync: false
      - key: DEMO_DISCIPLINES
        value: all
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tourbo-db
          property: connectionString

databases:
  - name: tourbo-db
    plan: free
