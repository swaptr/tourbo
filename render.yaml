services:
  - type: web
    name: tourbo
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    plan: free
    # Deploy a push to main only after every GitHub check on it passes (.github/workflows/ci.yml).
    autoDeployTrigger: checksPass
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: OUTREACH_REPLY_DOMAIN
        sync: false
      - key: MCP_TOKENS
        sync: false
      - key: DEMO_DISCIPLINES
        value: all
      - key: PUBLIC_URL
        sync: false
      # Supabase, shared pooler in session mode (IPv4; port 5432):
      # postgresql://postgres.<ref>:<password>@aws-<n>-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DATABASE_URL
        sync: false
