# Render service shape only. Secrets and deploys are driven from GitHub (.github/workflows/ci.yml):
# the deploy job writes every env var from GitHub secrets to this service, then deploys the commit.
services:
  - type: web
    name: tourbo
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    plan: free
    # Next to the Supabase database (eu-west-3, Paris); every page makes several DB round trips.
    region: frankfurt
    # GitHub Actions deploys after its checks pass; Render never deploys on its own.
    autoDeployTrigger: "off"
