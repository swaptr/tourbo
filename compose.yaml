# Local dev services. Start: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tourbo
      POSTGRES_PASSWORD: tourbo
      POSTGRES_DB: tourbo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourbo -d tourbo"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Hosted web app + remote MCP endpoint. Start: docker compose up -d --build web
  web:
    build: .
    profiles: [app]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://tourbo:tourbo@postgres:5432/tourbo
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Self-hosted MCP server (Streamable HTTP, needs QLOO_API_KEY + MCP_TOKENS in .env).
  # Start: docker compose --profile mcp up -d --build mcp  → http://127.0.0.1:8787/mcp
  mcp:
    build:
      context: .
      dockerfile: packages/mcp/Dockerfile
    image: tourbo-mcp:local
    profiles: [mcp]
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  pgdata:
