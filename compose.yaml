# Local dev services. Start: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tourbo
      POSTGRES_PASSWORD: tourbo
      POSTGRES_DB: tourbo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourbo -d tourbo"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
